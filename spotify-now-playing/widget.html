<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Now Playing</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }
  #spotify-widget {
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    box-sizing: border-box;
  }

  /* Nota musical: sustituye al "punto" de estado, con pulso suave mientras suena */
  #sw-note {
    font-size: 15px;
    line-height: 1;
    color: #1DB954;
    flex-shrink: 0;
    display: inline-block;
    opacity: 0.4;
    transform: scale(1);
    transition: opacity .3s ease;
  }
  #sw-note.sw-pulsing {
    opacity: 1;
    animation: sw-note-pulse 1.4s ease-in-out infinite;
  }
  @keyframes sw-note-pulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.2); }
  }

  /* Columna de texto: línea 1 fija + línea 2 con scroll infinito, todo a la izquierda */
  #sw-textcol {
    max-width: 210px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    text-align: left;
    gap: 2px;
  }
  #sw-line1 {
    font-size: 12px;
    line-height: 1.3;
    font-weight: 400;
    color: #9a9a9a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    text-align: left;
  }
  #sw-text-wrap {
    overflow: hidden;
    position: relative;
    max-width: 100%;
    text-align: left;
    -webkit-mask-image: linear-gradient(to right, black 92%, transparent 100%);
    mask-image: linear-gradient(to right, black 92%, transparent 100%);
  }
  #sw-track {
    display: inline-flex;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.3;
    color: #f2f2f2;
    will-change: transform;
  }
  #sw-track.sw-scrolling {
    animation-name: sw-marquee;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .sw-copy { padding-right: 36px; }
  @keyframes sw-marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
</style>
</head>
<body>
  <div id="spotify-widget">
    <span id="sw-note">&#9834;</span>
    <div id="sw-textcol">
      <div id="sw-line1">Marcos no está escuchando música</div>
      <div id="sw-text-wrap">
        <span id="sw-track"></span>
      </div>
    </div>
  </div>

  <script>
    var lastRenderedTrack = null;
    var MARQUEE_SPEED_PX_PER_SEC = 35; // velocidad del scroll

    function buildCopy(fullText) {
      var wrapper = document.createElement('span');
      wrapper.className = 'sw-copy';
      wrapper.textContent = fullText;
      return wrapper;
    }

    function renderTrack(fullText) {
      if (fullText === lastRenderedTrack) return; // evita reiniciar la animación sin motivo
      lastRenderedTrack = fullText;

      var wrap = document.getElementById('sw-text-wrap');
      var track = document.getElementById('sw-track');

      track.classList.remove('sw-scrolling');
      track.style.animation = 'none';
      track.style.transform = 'none';
      track.innerHTML = '';
      track.appendChild(buildCopy(fullText));

      requestAnimationFrame(function () {
        var wrapWidth = wrap.clientWidth;
        var singleWidth = track.scrollWidth;

        if (singleWidth > wrapWidth + 2) {
          // No cabe entero: duplicamos el contenido para un scroll infinito sin cortes
          track.appendChild(buildCopy(fullText));
          var duration = Math.max(singleWidth / MARQUEE_SPEED_PX_PER_SEC, 4);
          track.style.animation = 'sw-marquee ' + duration + 's linear infinite';
          track.classList.add('sw-scrolling');
        }
      });
    }

    async function updateSpotifyWidget() {
      var line1 = document.getElementById('sw-line1');
      var textWrap = document.getElementById('sw-text-wrap');
      var note = document.getElementById('sw-note');

      try {
        // Ruta relativa: al vivir en el mismo dominio que /api/now-playing, no hace falta CORS.
        const res = await fetch('/api/now-playing');
        const data = await res.json();

        if (data.isPlaying) {
          line1.textContent = 'Marcos está escuchando';
          textWrap.style.display = 'block';
          note.classList.add('sw-pulsing');
          renderTrack(data.title + ' · ' + data.artist);
        } else {
          line1.textContent = 'Marcos no está escuchando música';
          textWrap.style.display = 'none';
          note.classList.remove('sw-pulsing');
          lastRenderedTrack = null; // para que la próxima canción reinicie el scroll bien
        }
      } catch (e) {
        line1.textContent = 'Marcos no está escuchando música';
        textWrap.style.display = 'none';
        note.classList.remove('sw-pulsing');
      }
    }
    updateSpotifyWidget();
    setInterval(updateSpotifyWidget, 10000);
  </script>
</body>
</html>
