<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Now Playing</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }
  #spotify-widget {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #121212;
    border: 1px solid #2b2b2f;
    border-radius: 999px;
    padding: 9px 16px 9px 8px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #f2f2f2;
    box-sizing: border-box;
    width: 280px;
  }
  #sw-cover {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    flex-shrink: 0;
    background: conic-gradient(from 220deg, #1DB954, #0c5d29, #1a1a1a, #1DB954);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  #sw-eq {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 12px;
    flex-shrink: 0;
  }
  #sw-eq span {
    width: 2px;
    background: #1DB954;
    border-radius: 2px;
    display: block;
    animation: sw-bounce 1.1s ease-in-out infinite;
  }
  #sw-eq span:nth-child(2) { animation-delay: .2s; }
  #sw-eq span:nth-child(3) { animation-delay: .4s; }
  @keyframes sw-bounce { 0%, 100% { height: 3px; } 50% { height: 12px; } }

  /* Columna de texto: línea 1 fija + línea 2 con scroll infinito */
  #sw-textcol {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }
  #sw-line1 {
    font-size: 11px;
    line-height: 1.2;
    color: #9a9a9a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #sw-text-wrap {
    overflow: hidden;
    position: relative;
    -webkit-mask-image: linear-gradient(to right, black 92%, transparent 100%);
    mask-image: linear-gradient(to right, black 92%, transparent 100%);
  }
  #sw-track {
    display: inline-flex;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.25;
    will-change: transform;
  }
  #sw-track.sw-scrolling {
    animation-name: sw-marquee;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .sw-copy { padding-right: 36px; }
  @keyframes sw-marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
</style>
</head>
<body>
  <div id="spotify-widget">
    <div id="sw-cover">🎵</div>
    <div id="sw-textcol">
      <div id="sw-line1">Marcos no está escuchando música</div>
      <div id="sw-text-wrap">
        <span id="sw-track"></span>
      </div>
    </div>
    <div id="sw-eq"><span></span><span></span><span></span></div>
  </div>

  <script>
    var lastRenderedTrack = null;
    var MARQUEE_SPEED_PX_PER_SEC = 35; // velocidad del scroll

    function buildCopy(fullText) {
      var wrapper = document.createElement('span');
      wrapper.className = 'sw-copy';
      wrapper.textContent = fullText;
      return wrapper;
    }

    function renderTrack(fullText) {
      if (fullText === lastRenderedTrack) return; // evita reiniciar la animación sin motivo
      lastRenderedTrack = fullText;

      var wrap = document.getElementById('sw-text-wrap');
      var track = document.getElementById('sw-track');

      track.classList.remove('sw-scrolling');
      track.style.animation = 'none';
      track.style.transform = 'none';
      track.innerHTML = '';
      track.appendChild(buildCopy(fullText));

      requestAnimationFrame(function () {
        var wrapWidth = wrap.clientWidth;
        var singleWidth = track.scrollWidth;

        if (singleWidth > wrapWidth + 2) {
          // No cabe entero: duplicamos el contenido para un scroll infinito sin cortes
          track.appendChild(buildCopy(fullText));
          var duration = Math.max(singleWidth / MARQUEE_SPEED_PX_PER_SEC, 4);
          track.style.animation = 'sw-marquee ' + duration + 's linear infinite';
          track.classList.add('sw-scrolling');
        }
      });
    }

    async function updateSpotifyWidget() {
      var line1 = document.getElementById('sw-line1');
      var textWrap = document.getElementById('sw-text-wrap');
      var eq = document.getElementById('sw-eq');
      var cover = document.getElementById('sw-cover');

      try {
        // Ruta relativa: al vivir en el mismo dominio que /api/now-playing, no hace falta CORS.
        const res = await fetch('/api/now-playing');
        const data = await res.json();

        if (data.isPlaying) {
          line1.textContent = 'Marcos está escuchando';
          textWrap.style.display = 'block';
          renderTrack(data.title + ' · ' + data.artist);
          eq.style.display = 'flex';
          if (data.albumImage) {
            cover.style.backgroundImage = 'url(' + data.albumImage + ')';
            cover.textContent = '';
          }
        } else {
          line1.textContent = 'Marcos no está escuchando música';
          textWrap.style.display = 'none';
          lastRenderedTrack = null; // para que la próxima canción reinicie el scroll bien
          eq.style.display = 'none';
          cover.style.backgroundImage = 'none';
          cover.textContent = '🎵';
        }
      } catch (e) {
        line1.textContent = 'Marcos no está escuchando música';
        textWrap.style.display = 'none';
        eq.style.display = 'none';
      }
    }
    updateSpotifyWidget();
    setInterval(updateSpotifyWidget, 10000);
  </script>
</body>
</html>
