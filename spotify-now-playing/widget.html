<!DOCTYPE html>
  <html lang="es">
  <head>
  <meta charset="UTF-8">
  <title>Now Playing</title>
  <style>
    html, body {
      margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
}
  #spotify-widget {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #121212;
    border: 1px solid #2b2b2f;
    border-radius: 999px;
    padding: 8px 16px 8px 8px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: #f2f2f2;
        box-sizing: border-box;
    max-width: 320px;
}
  #sw-cover {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    flex-shrink: 0;
    background: conic-gradient(from 220deg, #1DB954, #0c5d29, #1a1a1a, #1DB954);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
}
  #sw-eq {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 12px;
    flex-shrink: 0;
}
  #sw-eq span {
    width: 2px;
    background: #1DB954;
    border-radius: 2px;
    display: block;
    animation: sw-bounce 1.1s ease-in-out infinite;
}
  #sw-eq span:nth-child(2) { animation-delay: .2s; }
  #sw-eq span:nth-child(3) { animation-delay: .4s; }
  @keyframes sw-bounce { 0%, 100% { height: 3px; } 50% { height: 12px; } }
  #sw-text { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
  </head>
  <body>
    <div id="spotify-widget">
      <div id="sw-cover">🎵</div>
      <div style="min-width:0;overflow:hidden;">
        <span style="color:#9a9a9a;">Sonando: </span><span id="sw-text">Cargando...</span>
      </div>
      <div id="sw-eq"><span></span><span></span><span></span></div>
    </div>

    <script>
      async function updateSpotifyWidget() {
        try {
        const res = await fetch('/api/now-playing');
        const data = await res.json();
        const text = document.getElementById('sw-text');
        const eq = document.getElementById('sw-eq');
        const cover = document.getElementById('sw-cover');
        if (data.isPlaying) {
          text.textContent = data.title + ' · ' + data.artist;
          eq.style.display = 'flex';
          if (data.albumImage) {
            cover.style.backgroundImage = 'url(' + data.albumImage + ')';
            cover.textContent = '';
          }
        } else {
          text.textContent = 'nada por ahora';
          eq.style.display = 'none';
          cover.style.backgroundImage = 'none';
          cover.textContent = '🎵';
        }
        } catch (e) {
        document.getElementById('sw-text').textContent = 'sin conexión';
        }
}
    updateSpotifyWidget();
    setInterval(updateSpotifyWidget, 10000);
  </script>
    </body>
    </html>
