<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Now Playing</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }
  #spotify-widget {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #121212;
    border: 1px solid #2b2b2f;
    border-radius: 999px;
    padding: 8px 16px 8px 8px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: #f2f2f2;
    box-sizing: border-box;
    width: 280px;
  }
  #sw-cover {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    flex-shrink: 0;
    background: conic-gradient(from 220deg, #1DB954, #0c5d29, #1a1a1a, #1DB954);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  #sw-eq {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 12px;
    flex-shrink: 0;
  }
  #sw-eq span {
    width: 2px;
    background: #1DB954;
    border-radius: 2px;
    display: block;
    animation: sw-bounce 1.1s ease-in-out infinite;
  }
  #sw-eq span:nth-child(2) { animation-delay: .2s; }
  #sw-eq span:nth-child(3) { animation-delay: .4s; }
  @keyframes sw-bounce { 0%, 100% { height: 3px; } 50% { height: 12px; } }

  #sw-text-wrap {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    position: relative;
    -webkit-mask-image: linear-gradient(to right, black 92%, transparent 100%);
    mask-image: linear-gradient(to right, black 92%, transparent 100%);
  }
  #sw-track {
    display: inline-flex;
    white-space: nowrap;
    will-change: transform;
  }
  #sw-track.sw-scrolling {
    animation-name: sw-marquee;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .sw-copy { padding-right: 36px; }
  .sw-label { color: #9a9a9a; }
  .sw-title { font-weight: 600; }
  @keyframes sw-marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
</style>
</head>
<body>
  <div id="spotify-widget">
    <div id="sw-cover">🎵</div>
    <div id="sw-text-wrap">
      <span id="sw-track"></span>
    </div>
    <div id="sw-eq"><span></span><span></span><span></span></div>
  </div>

  <script>
    var lastRenderedText = null;
    var MARQUEE_SPEED_PX_PER_SEC = 35;

    function buildCopy(fullText) {
      var wrapper = document.createElement('span');
      wrapper.className = 'sw-copy';
      var label = document.createElement('span');
      label.className = 'sw-label';
      label.textContent = 'Sonando: ';
      var title = document.createElement('span');
      title.className = 'sw-title';
      title.textContent = fullText;
      wrapper.appendChild(label);
      wrapper.appendChild(title);
      return wrapper;
    }

    function renderText(fullText) {
      if (fullText === lastRenderedText) return;
      lastRenderedText = fullText;

      var wrap = document.getElementById('sw-text-wrap');
      var track = document.getElementById('sw-track');

      track.classList.remove('sw-scrolling');
      track.style.animation = 'none';
      track.style.transform = 'none';
      track.innerHTML = '';
      track.appendChild(buildCopy(fullText));

    <div id="sw-eq"><span></span><span></span><span></span></div>

    var lastRenderedText = null;
    var MARQUEE_SPEED_PX_PER_SEC = 35;

      var track = document.getElementById('sw-track');

          track.appendChild(buildCopy(fullText));

          track.style.animation = 'sw-marquee ' + duration + 's linear infinite';
          track.classList.add('sw-scrolling');
        }
      });
    }

    async function updateSpotifyWidget() {
      try {
        const res = await fetch('/api/now-playing');
        const data = await res.json();
        const eq = document.getElementById('sw-eq');
        const cover = document.getElementById('sw-cover');
        if (data.isPlaying) {
          renderText(data.title + ' · ' + data.artist);
          eq.style.display = 'flex';
          if (data.albumImage) {
            cover.style.backgroundImage = 'url(' + data.albumImage + ')';
            cover.textContent = '';
          }
        } else {
          renderText('nada por ahora');
          eq.style.display = 'none';
          cover.style.backgroundImage = 'none';
          cover.textContent = '🎵';
        }
      } catch (e) {
        renderText('sin conexión');
      }
    }
    updateSpotifyWidget();
    setInterval(updateSpotifyWidget, 10000);
  </script>
